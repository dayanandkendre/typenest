<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retro Space Typer | TypeNest Arcade</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/arcade-core.css">

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #030712; color: #f8fafc; font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; }
    .page-shell { max-width: 1050px; margin: 0 auto; padding: 16px 14px 40px; }
    .game-box {
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 20px;
      background: #070e1e;
      overflow: hidden;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6);
    }
    .hud-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .hud-stats { display: flex; gap: 16px; font-size: 13px; font-weight: 700; align-items: center; }
    .hud-stats div { text-align: center; }
    .hud-stats small { display: block; font-size: 9px; color: #94a3b8; text-transform: uppercase; }
    .hud-stats b { font-size: 15px; color: #38bdf8; }
    .hearts { color: #f43f5e; font-size: 15px; letter-spacing: 2px; }

    #arena {
      position: relative;
      height: min(65vh, 560px);
      min-height: 420px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 15%, #0d1e3d 0%, #030712 85%);
    }
    #fxCanvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }
    .grid-lines {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* ALIEN SHIP TARGET CARD */
    .alien-ship {
      position: absolute;
      transform: translate3d(-50%, 0, 0);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 12px;
      padding: 8px 14px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
      z-index: 10;
      transition: transform 0.1s, border-color 0.15s;
      white-space: nowrap;
    }
    .alien-ship.targeted {
      border-color: #f43f5e;
      box-shadow: 0 0 25px rgba(244, 63, 94, 0.5);
      transform: translate3d(-50%, 0, 0) scale(1.08);
      z-index: 20;
    }
    .alien-ship .ship-icon { font-size: 12px; color: #f43f5e; margin-bottom: 2px; }
    .alien-ship .word { font-family: monospace; font-size: 16px; font-weight: 800; letter-spacing: 1px; }
    .alien-ship .matched { color: #34d399; text-shadow: 0 0 8px #34d399; }
    .alien-ship .unmatched { color: #ffffff; }
    .alien-ship .mr { font-size: 11px; color: #fbbf24; margin-top: 2px; }

    /* PLAYER CANNON / SHIP */
    #playerCannon {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      clip-path: polygon(50% 0%, 0% 100%, 50% 75%, 100% 100%);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.8);
      z-index: 15;
      transition: left 0.12s ease-out;
    }

    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 40;
      gap: 16px;
      text-align: center;
    }
    .modal-btn {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #fff;
      border: none;
      padding: 12px 30px;
      font-size: 14px;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(14, 165, 233, 0.5);
      transition: transform 0.15s;
    }
    .modal-btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div id="tn-layout"></div>

  <div class="page-shell">
    <div style="font-size: 13px; color: #94a3b8; margin-bottom: 12px;">
      <a href="/arcade/index.html" style="color: inherit; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Arcade Hub</a>
      <span> / </span><strong style="color: #fff;">Retro Space Typer</strong>
    </div>

    <div class="game-box">
      <div class="hud-bar">
        <div>
          <span style="font-size: 10px; color: #38bdf8; font-weight: 800; letter-spacing: 1px; display: block;">ORBITAL DEFENSE</span>
          <strong style="font-size: 15px;">Alien Interceptor</strong>
        </div>
        <div class="hud-stats">
          <div><small>Wave</small><b id="waveTxt">1</b></div>
          <div><small>WPM</small><b id="wpmTxt">0</b></div>
          <div><small>Score</small><b id="scoreTxt">0</b></div>
          <div><small>Shields</small><div class="hearts" id="heartsTxt">❤️❤️❤️</div></div>
        </div>
      </div>

      <div id="arena">
        <div class="grid-lines"></div>
        <canvas id="fxCanvas"></canvas>
        <div id="playerCannon"></div>

        <div id="readyModal" class="modal-overlay">
          <div style="font-size: 40px; color: #38bdf8;"><i class="fa-solid fa-shuttle-space"></i></div>
          <h2 style="font-size: 26px; margin: 0;">RETRO SPACE TYPER</h2>
          <p style="color: #94a3b8; max-width: 420px; font-size: 13px; line-height: 1.6; margin: 0;">
            Descend honarya alien ships var target lock kara. Valid key type kelyas plasma laser fire hoil aani ship blast hoil!
          </p>
          <button class="modal-btn" id="startBtn">Launch Interceptor (Space / Click)</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // DATASET
    const WORDS = [
      { en: "orbit", mr: "कक्षा" },
      { en: "space", mr: "अवकाश" },
      { en: "laser", mr: "किरणझोत" },
      { en: "galaxy", mr: "आकाशगंगा" },
      { en: "rocket", mr: "क्षेपणास्त्र" },
      { en: "shield", mr: "संरक्षक ढाल" },
      { en: "plasma", mr: "प्लाझ्मा" },
      { en: "cosmos", mr: "विश्व" },
      { en: "meteor", mr: "उल्का" },
      { en: "stellar", mr: "तारकाविषयक" },
      { en: "gravity", mr: "गुरुत्वाकर्षण" },
      { en: "comet", mr: "धूमकेतू" },
      { en: "nebula", mr: "तेजोमेघ" },
      { en: "voyage", mr: "मोहीम" },
      { en: "pulsar", mr: "स्पंदक तारा" }
    ];

    // AUDIO SYNTHESIZER
    let actx = null;
    function initAudio() {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    }
    function playTone(freq, dur, type='triangle', vol=0.12, slide=null) {
      if (!actx) return;
      try {
        const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }

    // ENGINE
    const arena = document.getElementById('arena');
    const cannon = document.getElementById('playerCannon');
    const cv = document.getElementById('fxCanvas'), cx = cv.getContext('2d');
    
    let running = false, score = 0, lives = 3, wave = 1, typedChars = 0, startTime = 0;
    let ships = [], target = null, typed = "", lasers = [], particles = [];
    let spawnTimer = null, lastTime = performance.now();

    function resize() {
      cv.width = arena.clientWidth;
      cv.height = arena.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function createAlienShip() {
      if (!running || ships.length >= 4) return;
      const data = WORDS[Math.floor(Math.random() * WORDS.length)];
      const el = document.createElement('div');
      el.className = 'alien-ship';
      el.innerHTML = `
        <div class="ship-icon"><i class="fa-solid fa-satellite-dish"></i></div>
        <div class="word"><span class="unmatched">${data.en}</span></div>
        <div class="mr">${data.mr}</div>
      `;
      arena.appendChild(el);
      
      const w = 120, maxLeft = arena.clientWidth - w;
      const x = 30 + Math.random() * Math.max(10, maxLeft - 60);
      const obj = { en: data.en, mr: data.mr, x, y: -65, speed: 28 + wave * 4, el };
      el.style.left = `${x}px`;
      el.style.top = `${obj.y}px`;
      ships.push(obj);
    }

    function fireLaser(tx, ty) {
      const sx = cannon.offsetLeft + 22, sy = cannon.offsetTop;
      lasers.push({ sx, sy, tx, ty, prog: 0 });
      playTone(850, 0.07, 'sawtooth', 0.1, 240);
    }

    function createExplosion(x, y) {
      playTone(130, 0.22, 'square', 0.18, 45);
      for (let i = 0; i < 22; i++) {
        const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 160;
        particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, col: '#38bdf8' });
      }
    }

    function loop(now) {
      if (!running) return;
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      const limitY = arena.clientHeight - 80;
      for (let i = ships.length - 1; i >= 0; i--) {
        const s = ships[i];
        s.y += s.speed * dt;
        s.el.style.top = `${s.y}px`;

        if (s.y >= limitY) {
          createExplosion(s.x, s.y);
          s.el.remove();
          ships.splice(i, 1);
          if (target === s) { target = null; typed = ""; }
          lives--;
          updateHUD();
          if (lives <= 0) { gameOver(); return; }
        }
      }

      cx.clearRect(0, 0, cv.width, cv.height);

      for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.prog += dt * 8;
        cx.strokeStyle = '#38bdf8';
        cx.lineWidth = 3;
        cx.shadowBlur = 14;
        cx.shadowColor = '#0ea5e9';
        cx.beginPath();
        cx.moveTo(l.sx, l.sy);
        cx.lineTo(l.tx, l.ty);
        cx.stroke();
        if (l.prog >= 1) lasers.splice(i, 1);
      }
      cx.shadowBlur = 0;

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 2.2;
        cx.fillStyle = p.col;
        cx.globalAlpha = Math.max(0, p.life);
        cx.beginPath();
        cx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        cx.fill();
        if (p.life <= 0) particles.splice(i, 1);
      }
      cx.globalAlpha = 1;

      requestAnimationFrame(loop);
    }

    function updateHUD() {
      document.getElementById('scoreTxt').textContent = score;
      document.getElementById('waveTxt').textContent = wave;
      document.getElementById('heartsTxt').textContent = '❤️'.repeat(Math.max(0, lives)) || '💥';
      const min = Math.max((performance.now() - startTime) / 60000, 0.02);
      document.getElementById('wpmTxt').textContent = Math.round((typedChars / 5) / min);
    }

    function updateTargetUI() {
      if (!target) return;
      const m = target.en.slice(0, typed.length), u = target.en.slice(typed.length);
      target.el.querySelector('.word').innerHTML = `<span class="matched">${m}</span><span class="unmatched">${u}</span>`;
    }

    window.addEventListener('keydown', (e) => {
      initAudio();
      if (!running) {
        if (e.code === 'Space') startGame();
        return;
      }
      if (e.key.length !== 1 || e.ctrlKey || e.altKey || e.metaKey || e.key === ' ') return;
      const k = e.key.toLowerCase();

      if (!target) {
        const c = ships.filter(s => s.en[0] === k && s.y > -20).sort((a,b) => b.y - a.y)[0];
        if (c) {
          target = c;
          target.el.classList.add('targeted');
          typed = k;
          typedChars++;
          cannon.style.left = `${target.x}px`;
          fireLaser(target.x, target.y);
          updateTargetUI();
        } else {
          playTone(140, 0.08, 'sawtooth', 0.1);
        }
      } else {
        if (target.en[typed.length] === k) {
          typed += k;
          typedChars++;
          fireLaser(target.x, target.y);
          updateTargetUI();

          if (typed.length === target.en.length) {
            createExplosion(target.x, target.y);
            score += target.en.length * 20;
            target.el.remove();
            ships = ships.filter(s => s !== target);
            target = null;
            typed = "";
            if (score > wave * 250) wave++;
            updateHUD();
          }
        } else {
          playTone(140, 0.08, 'sawtooth', 0.1);
        }
      }
    });

    function startGame() {
      document.getElementById('readyModal').style.display = 'none';
      ships.forEach(s => s.el.remove());
      ships = []; lasers = []; particles = []; target = null; typed = "";
      score = 0; lives = 3; wave = 1; typedChars = 0;
      startTime = performance.now();
      running = true;
      updateHUD();
      if (spawnTimer) clearInterval(spawnTimer);
      spawnTimer = setInterval(createAlienShip, 1800);
      createAlienShip();
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      running = false;
      if (spawnTimer) clearInterval(spawnTimer);
      const modal = document.getElementById('readyModal');
      modal.innerHTML = `
        <div style="font-size: 40px; color: #f43f5e;"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h2 style="font-size: 26px; margin: 0; color: #f43f5e;">SHIELD BREACHED</h2>
        <p style="color: #94a3b8; font-size: 14px; margin: 0;">Final Score: <b style="color: #fff;">${score}</b></p>
        <button class="modal-btn" onclick="startGame()">Play Again</button>
      `;
      modal.style.display = 'flex';
    }

    document.getElementById('startBtn').onclick = startGame;
  </script>

  <!-- FIX: type="module" dila ahe jyane layout.js cha crash honar nahi -->
  <script type="module" src="/assets/js/layout.js"></script>
</body>
</html>
