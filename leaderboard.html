<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeNest Academy | Global Typist Leaderboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- Top Banner -->
    <div class="border-b border-slate-800 pb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white flex items-center gap-3">
          <i class="fa-solid fa-trophy text-amber-400"></i> Global Typist Leaderboard
        </h1>
        <p class="text-slate-400 text-sm mt-1">Live worldwide speed rankings verified by anti-cheat timing algorithms.</p>
      </div>

      <!-- Filter Tabs -->
      <div class="flex items-center gap-2 bg-[#111827] p-1 rounded-xl border border-slate-800">
        <button class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold">All Time</button>
        <button class="px-3 py-1.5 rounded-lg bg-transparent text-slate-400 hover:text-white text-xs font-semibold">Top Speed</button>
      </div>
    </div>

    <!-- Leaderboard Table Card -->
    <div class="bg-[#111827]/80 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-[#0b0f19] text-xs uppercase tracking-wider text-slate-400 border-b border-slate-800">
            <tr>
              <th class="py-4 px-6">Rank</th>
              <th class="py-4 px-6">Typist Name</th>
              <th class="py-4 px-6">Preset</th>
              <th class="py-4 px-6 text-right">Speed (WPM)</th>
              <th class="py-4 px-6 text-right">Accuracy</th>
              <th class="py-4 px-6 text-right">Tier Badge</th>
            </tr>
          </thead>
          <tbody id="leaderboardRows" class="divide-y divide-slate-800/60 font-mono">
            <!-- Loading State -->
            <tr>
              <td colspan="6" class="text-center py-10 text-slate-400 font-sans">
                <i class="fa-solid fa-circle-notch fa-spin text-indigo-500 text-xl mr-2"></i> Loading live rankings...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Motivation Banner -->
    <div class="bg-gradient-to-r from-indigo-900/40 via-purple-900/20 to-slate-900/60 border border-indigo-500/20 rounded-3xl p-6 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center text-2xl border border-indigo-500/30">
          <i class="fa-solid fa-bolt-lightning"></i>
        </div>
        <div>
          <h3 class="text-base font-bold text-white">Want to claim the #1 spot?</h3>
          <p class="text-xs text-slate-400">Take timed tests and practice home row bursts to climb the rankings.</p>
        </div>
      </div>
      <a href="tests.html" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs transition shadow-lg shadow-indigo-600/30 whitespace-nowrap">
        Take a Speed Test &rarr;
      </a>
    </div>

  </main>

  <!-- Live Leaderboard Script via Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      query, 
      orderBy, 
      limit, 
      getDocs 
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAXzw_g1r7kvYC2d6_d4RqDOoTF_svAphc",
      authDomain: "typenext-5bd90.firebaseapp.com",
      projectId: "typenext-5bd90",
      storageBucket: "typenext-5bd90.firebasestorage.app",
      messagingSenderId: "848488048236",
      appId: "1:848488048236:web:a742a647977a48ca63da49",
      measurementId: "G-B5WGZM350T"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function fetchLeaderboard() {
      const tbody = document.getElementById("leaderboardRows");
      if (!tbody) return;

      try {
        // Top 25 Typists sorted by WPM (Highest to Lowest)
        const q = query(collection(db, "leaderboard"), orderBy("wpm", "desc"), limit(25));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="text-center py-8 text-slate-400 font-sans">
                <i class="fa-solid fa-medal text-amber-400 text-lg mb-2 block"></i>
                No scores recorded yet! Complete a test to become the first on the board.
              </td>
            </tr>`;
          return;
        }

        tbody.innerHTML = "";
        let rank = 1;
        const currentUid = localStorage.getItem("tn_uid");

        querySnapshot.forEach((docItem) => {
          const row = docItem.data();
          const isCurrentUser = (docItem.id === currentUid);

          // Calculate Badges based on WPM
          let badge = "Novice";
          let badgeClass = "bg-slate-700/40 text-slate-300 border-slate-600/50";

          if (row.wpm >= 100) {
            badge = "Grandmaster";
            badgeClass = "bg-purple-500/20 text-purple-300 border-purple-500/40";
          } else if (row.wpm >= 80) {
            badge = "Master";
            badgeClass = "bg-amber-500/20 text-amber-300 border-amber-500/40";
          } else if (row.wpm >= 60) {
            badge = "Professional";
            badgeClass = "bg-indigo-500/20 text-indigo-300 border-indigo-500/40";
          } else if (row.wpm >= 40) {
            badge = "Intermediate";
            badgeClass = "bg-emerald-500/20 text-emerald-300 border-emerald-500/40";
          }

          const tr = document.createElement("tr");
          tr.className = isCurrentUser 
            ? "bg-indigo-950/40 text-indigo-200 border-l-4 border-indigo-500" 
            : "hover:bg-slate-800/40 transition";

          tr.innerHTML = `
            <td class="py-3.5 px-6 font-bold flex items-center gap-2">
              ${rank === 1 ? '<i class="fa-solid fa-crown text-amber-400 text-sm"></i>' : `#${rank}`}
            </td>
            <td class="py-3.5 px-6 font-sans font-medium text-white flex items-center gap-2.5">
              ${row.photoURL 
                ? `<img src="${row.photoURL}" class="w-6 h-6 rounded-full object-cover">` 
                : `<span class="w-6 h-6 rounded-full bg-indigo-600 text-[10px] flex items-center justify-center font-bold">TN</span>`
              }
              <span>${row.name || "Anonymous Typist"}${isCurrentUser ? " (You)" : ""}</span>
            </td>
            <td class="py-3.5 px-6 text-slate-400 font-sans text-xs">${row.preset || "Classic Test"}</td>
            <td class="py-3.5 px-6 text-right font-extrabold text-indigo-400 text-base">${row.wpm}</td>
            <td class="py-3.5 px-6 text-right text-emerald-400">${row.accuracy}%</td>
            <td class="py-3.5 px-6 text-right">
              <span class="px-2.5 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider border ${badgeClass}">
                ${badge}
              </span>
            </td>
          `;

          tbody.appendChild(tr);
          rank++;
        });

      } catch (error) {
        console.error("Error fetching leaderboard:", error);
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="text-center py-6 text-rose-400 font-sans text-xs">
              Unable to load leaderboard. Please check Firestore security rules.
            </td>
          </tr>`;
      }
    }

    document.addEventListener("DOMContentLoaded", fetchLeaderboard);
  </script>

  <!-- Reusable Modular Layout Script -->
  <script type="module" src="assets/js/layout.js"></script>

</body>
</html>
