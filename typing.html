<!DOCTYPE html>
<html>
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8300473989533585" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Speed Test | TypeNest</title>
    <link rel="stylesheet" href="typing.css">
</head>
<body>

<div class="typing-page">
    
    <!-- =========================================
         BRAND TOP NAVBAR
    ========================================= -->
    <div class="topbar">
        <div class="nav-left">
            <span class="brand-logo" onclick="window.location.href='index.html'">Type<span>Nest</span></span>
        </div>
        <div class="nav-right">
            <button class="login-profile-btn" id="loginNavBtn">
                👤 <span id="loginBtnText">Sign In</span>
            </button>
        </div>
    </div>

    <!-- =========================================
         WORKING MODES SUB-BAR (BELOW TOPBAR)
    ========================================= -->
    <div class="sub-config-wrapper">
        <div class="config-bar">
            <div class="config-group" id="typeGroup">
                <span class="cfg-btn" data-type="punctuation">@ punctuation</span>
                <span class="cfg-btn active-cfg" data-type="normal"># normal</span>
            </div>
            <div class="config-gap">|</div>
            <div class="config-group" id="modeGroup">
                <span class="cfg-btn active-cfg" data-mode="time">🕒 time</span>
                <span class="cfg-btn" data-mode="words">🔤 words</span>
            </div>
            <div class="config-gap">|</div>
            <div class="config-group" id="timeGroup">
                <span class="cfg-btn" data-value="15">15</span>
                <span class="cfg-btn active-cfg" data-value="30">30</span>
                <span class="cfg-btn" data-value="60">60</span>
            </div>
        </div>
    </div>

    <!-- MAIN TYPING CONTEXT CONTAINER -->
    <div class="main-container" id="typingContainer">
        <!-- LARGE LIVE TIMER / WORD COUNT INDICATOR -->
        <div class="live-timer-wrapper">
            <span id="time" class="giant-timer">30</span>
        </div>

        <!-- HORIZONTAL SINGLE LINE DISPLAY -->
        <div class="text-display" id="textDisplayContainer">
            <div class="text-display-inner" id="textDisplay"></div>
        </div>

        <!-- HIDDEN INPUT AREA -->
        <div class="hidden-input-box">
            <textarea id="input" autofocus></textarea>
        </div>
    </div>

    <!-- UNIQUE LIVE SHORTCUT FOOTER BAR (COVERS BOTTOM SPACE) -->
    <div class="bottom-shortcut-bar" id="footerShortcut">
        <span class="shortcut-item"><kbd>tab</kbd> + <kbd>enter</kbd> - restart test</span>
        <span class="shortcut-item"><kbd>esc</kbd> - focus input</span>
    </div>

    <!-- =========================================
         MONKEYTYPE STYLE DYNAMIC RESULT SCREEN
    ========================================= -->
    <div class="monkey-result-container" id="resultScreen" style="display: none;">
        <div class="result-main-row">
            <div class="giant-stats-block">
                <div class="giant-stat">
                    <span class="g-label">wpm</span>
                    <span class="g-value yellow-text" id="finalWpm">0</span>
                </div>
                <div class="giant-stat">
                    <span class="g-label">acc</span>
                    <span class="g-value yellow-text" id="finalAccuracy">0%</span>
                </div>
            </div>

            <div class="chart-placeholder-block">
                <div class="matrix-grid-ui">
                    <div class="matrix-bar accent-glow" style="height: 45%;"></div>
                    <div class="matrix-bar accent-glow" style="height: 70%;"></div>
                    <div class="matrix-bar accent-glow" style="height: 60%;"></div>
                    <div class="matrix-bar accent-glow" style="height: 85%;"></div>
                    <div class="matrix-bar accent-glow" style="height: 95%;"></div>
                </div>
                <span class="graph-text-hint">performance matrix grid</span>
            </div>
        </div>

        <div class="result-details-row">
            <div class="detail-box">
                <span class="d-label">mode</span>
                <span class="d-value" id="resultModeInfo">time 30</span>
            </div>
            <div class="detail-box">
                <span class="d-label">raw wpm</span>
                <span class="d-value" id="rawWpm">0</span>
            </div>
            <div class="detail-box">
                <span class="d-label">characters</span>
                <span class="d-value" id="finalChars">0/0/0/0</span>
            </div>
            <div class="detail-box">
                <span class="d-label">mistakes</span>
                <span class="d-value red-text" id="finalMistakes">0</span>
            </div>
            <div class="detail-box">
                <span class="d-label">personal best</span>
                <span class="d-value" id="bestWpm">0</span>
            </div>
        </div>

        <div class="result-action-buttons">
            <button class="icon-action-btn" onclick="location.reload()">[r] retry</button>
            <button class="icon-action-btn" onclick="window.location.href='index.html'">[h] home</button>
        </div>
    </div>

</div>

<audio id="keySound" src="key.wav" preload="auto"></audio>
<script type="module" src="typing.js"></script>

</body>
</html>
