<!DOCTYPE html>
<html>
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8300473989533585" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Speed Test | TypeNest</title>
    <link rel="stylesheet" href="typing.css">
</head>
<body>

<div class="typing-page">
    
    <!-- TOP BAR -->
    <div class="topbar">
        <div class="back-link" onclick="window.history.back()">← Back</div>
        <div class="level-title">Paragraph Speed Test</div>
        <div class="dummy-space"></div>
    </div>

    <!-- MAIN DISPLAY AREA -->
    <div class="main-container">
        
        <!-- LARGE TIMER -->
        <div class="live-timer-wrapper">
            <span id="time" class="giant-timer">00:00</span>
        </div>

        <!-- HORIZONTAL SINGLE LINE DISPLAY -->
        <div class="text-display">
            <div id="textDisplay"></div>
        </div>

        <!-- HIDDEN INPUT AREA -->
        <div class="hidden-input-box">
            <textarea id="input" autofocus></textarea>
        </div>

        <!-- STATS ROW (FITS PERFECTLY AT THE BOTTOM) -->
        <div class="stats">
            <div class="stat-box">
                <span class="stat-label">WPM</span>
                <span class="stat-value blue" id="wpm">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Accuracy</span>
                <span class="stat-value green" id="accuracy">100%</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Mistakes</span>
                <span class="stat-value red" id="mistakes">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Progress</span>
                <span class="stat-value blue" id="progress">0%</span>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- RESULT POPUP (LIGHT MODE PREMIUM) -->
<div id="resultPopup" class="popup">
    <div class="popup-card advanced-popup">
        <div class="popup-content">
            <div class="popup-left">
                <div class="level-circle" id="circleProgress">
                    <div class="popup-trophy">🏆</div>
                    <div id="popupTitle" class="circle-title">TEST COMPLETE</div>
                </div>
            </div>
            <div class="result-card">
                <div class="result-row">
                    <span>🎯 Accuracy</span>
                    <span id="finalAccuracy">100%</span>
                </div>
                <div class="result-row">
                    <span>❌ Mistakes</span>
                    <span id="finalMistakes">0</span>
                </div>
                <div class="result-row">
                    <span>⚡ Net WPM</span>
                    <span id="finalWpm">0</span>
                </div>
                <div class="result-row">
                    <span>👑 Best WPM</span>
                    <span id="bestWpm">0</span>
                </div>
            </div>
        </div>
        <div class="popup-buttons">
            <button id="restartBtn" onclick="location.reload()">🔄 Retry Test</button>
            <button id="backBtn" onclick="window.history.back()">⬅ Back Home</button>
        </div>
    </div>
</div>

<audio id="keySound" src="key.wav" preload="auto"></audio>
<script type="module" src="typing.js"></script>

</body>
</html>
