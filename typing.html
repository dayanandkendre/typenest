<!DOCTYPE html>
<html>
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8300473989533585" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Speed Test | TypeNest</title>
    <link rel="stylesheet" href="typing.css">
</head>
<body>

<div class="typing-page">
    
    <!-- =========================================
         INTEGRATED DYNAMIC TOP BAR
        ========================================= -->
    <div class="topbar">
        <div class="nav-left">
            <span class="brand-logo" onclick="window.location.href='index.html'">typenest</span>
        </div>
        
        <!-- Center Custom Configurations (Monkeytype Inspired but Unique Layout) -->
        <div class="config-bar" id="liveConfigBar">
            <div class="config-group">
                <span class="cfg-btn active-cfg">@ punctuation</span>
                <span class="cfg-btn"># numbers</span>
            </div>
            <div class="config-gap">|</div>
            <div class="config-group">
                <span class="cfg-btn active-cfg">🕒 time</span>
                <span class="cfg-btn">🔤 words</span>
                <span class="cfg-btn">💡 custom</span>
            </div>
            <div class="config-gap">|</div>
            <div class="config-group">
                <span class="cfg-btn">15</span>
                <span class="cfg-btn active-cfg">30</span>
                <span class="cfg-btn">60</span>
            </div>
        </div>

        <div class="nav-right">
            <!-- Dynamic Login Button / User Indicator -->
            <button class="login-profile-btn" id="loginNavBtn">
                👤 <span id="loginBtnText">Sign In</span>
            </button>
        </div>
    </div>

    <!-- MAIN INTERACTIVE HUB CONTAINER -->
    <div class="main-container" id="typingContainer">
        <!-- LARGE MINIMAL LIVE TIMER -->
        <div class="live-timer-wrapper">
            <span id="time" class="giant-timer">60</span>
        </div>

        <!-- HORIZONTAL SINGLE LINE DISPLAY -->
        <div class="text-display" id="textDisplayContainer">
            <div class="text-display-inner" id="textDisplay"></div>
        </div>

        <!-- HIDDEN INPUT FIELD -->
        <div class="hidden-input-box">
            <textarea id="input" autofocus></textarea>
        </div>
    </div>

    <!-- =========================================
         TYPENEST UNIQUE NEON INTERACTIVE DASHBOARD (RESULT SCREEN)
        ========================================= -->
    <div class="monkey-result-container" id="resultScreen" style="display: none;">
        <div class="result-main-row">
            
            <!-- LEFT GIANT DYNAMIC METRICS -->
            <div class="giant-stats-block">
                <div class="giant-stat">
                    <span class="g-label">wpm</span>
                    <span class="g-value yellow-text" id="finalWpm">0</span>
                </div>
                <div class="giant-stat">
                    <span class="g-label">acc</span>
                    <span class="g-value yellow-text" id="finalAccuracy">0%</span>
                </div>
            </div>

            <!-- CENTER TYPENEST HEAT-GRID MATRIX VIEW -->
            <div class="chart-placeholder-block">
                <div class="matrix-grid-ui">
                    <div class="matrix-bar accent-glow" style="height: 40%;"></div>
                    <div class="matrix-bar accent-glow" style="height: 65%;"></div>
                    <div class="matrix-bar accent-glow" style="height: 55%;"></div>
                    <div class="matrix-bar accent-glow" style="height: 80%;"></div>
                    <div class="matrix-bar accent-glow" style="height: 75%;"></div>
                    <div class="matrix-bar accent-glow" style="height: 95%;"></div>
                    <div class="matrix-bar accent-glow" style="height: 90%;"></div>
                </div>
                <span class="graph-text-hint">performance matrix grid</span>
            </div>
        </div>

        <!-- BOTTOM METRIC SPECIFICATIONS GRID -->
        <div class="result-details-row">
            <div class="detail-box">
                <span class="d-label">mode</span>
                <span class="d-value">paragraph/custom</span>
            </div>
            <div class="detail-box">
                <span class="d-label">raw wpm</span>
                <span class="d-value" id="rawWpm">0</span>
            </div>
            <div class="detail-box">
                <span class="d-label">characters</span>
                <span class="d-value" id="finalChars">0/0/0/0</span>
            </div>
            <div class="detail-box">
                <span class="d-label">mistakes</span>
                <span class="d-value red-text" id="finalMistakes">0</span>
            </div>
            <div class="detail-box">
                <span class="d-label">personal best</span>
                <span class="d-value" id="bestWpm">0</span>
            </div>
        </div>

        <!-- ACTION CONTROLS -->
        <div class="result-action-buttons">
            <button class="icon-action-btn" onclick="location.reload()" title="Retry Test">[r] retry</button>
            <button class="icon-action-btn" onclick="window.location.href='index.html'" title="Go Home">[h] home</button>
        </div>
    </div>

</div>

<audio id="keySound" src="key.wav" preload="auto"></audio>
<script type="module" src="typing.js"></script>

</body>
</html>
