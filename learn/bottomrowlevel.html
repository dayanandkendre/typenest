<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Level 1 | TypeNest

</title>

<link rel="stylesheet"
href="level.css">

</head>

<body>

<!-- =========================================
     TOP BAR
========================================= -->

<div class="topbar">

    <div class="back-link"
onclick="window.location.href='bottomrow.html'">

← Bottom Row

</div>

    <div class="level-title" id="levelNumber">

        Level 1

    </div>

    <div class="stars" id="topStars">

        ☆☆☆

    </div>

</div>




<!-- =========================================
     LESSON HEADER
========================================= -->

<div class="lesson-header">

    <h1 id="lessonTitle">

    F J Introduction

</h1>

<p id="lessonSubtitle">

    Let's learn the two most important keys — F and J.

</p>

</div>

<!-- =========================================
     LETTER BOXES
========================================= -->

<div class="letters-row" id="lettersRow">

    <div class="letter active" id="l0">

    f

</div>

    <div class="letter" id="l1">j</div>
<div class="letter" id="l2">f</div>
<div class="letter" id="l3">j</div>
<div class="letter" id="l4">f</div>
<div class="letter" id="l5">j</div>
<div class="letter" id="l6">f</div>
<div class="letter" id="l7">j</div>

</div>

<!-- TYPING AREA -->

<div class="typing-box">

<textarea id="typingInput" placeholder="Start typing here..."></textarea>    

</div>

<div id="capsWarning"
style="
display:none;
color:#ef4444;
font-weight:bold;
text-align:center;
margin-top:-20px;
margin-bottom:20px;
">
⚠️ Caps Lock is ON
</div>

<!-- KEYBOARD -->

<div class="keyboard">

    <div class="key">Z</div>

    <div class="key">X</div>

    <div class="key">C</div>

    <div class="key active-key">V</div>

    <div class="key">B</div>

    <div class="key">N</div>

    <div class="key active-key-j">M</div>

    <div class="key">,</div>

    <div class="key">.</div>

    <div class="key">/</div>

</div>

<!-- STATS -->

<div class="stats">

    <div class="stat-box">

        <span class="stat-label">

            Mistakes

        </span>

        <span class="stat-value red"
id="mistakes">

    0

</span>

    </div>



    <div class="stat-box">

        <span class="stat-label">

            Accuracy

        </span>

        <span class="stat-value green"
id="accuracy">

    100%

</span>

    </div>



    <div class="stat-box">

        <span class="stat-label">

            Progress

        </span>

        <span class="stat-value blue"
id="progress">

    0 / 8

</span>

    </div>

</div>

<!-- TIP BOX -->

<div class="tip-box">

    <div class="tip-title">

        💡 Tip

    </div>

    <div class="tip-text">

        Keep your fingers on F and J.
        These are your home keys.

    </div>

</div>

<!-- LEVEL COMPLETE POPUP -->

<div id="popup" class="popup">

    <div class="popup-card">

        <h2>

            🎉 Level Complete

        </h2>

        <h1 id="starRating">

            ⭐⭐⭐

        </h1>

        <div class="popup-buttons">

    <button id="restartBtn">

        🔄 Restart

    </button>

    <button id="backBtn">

        ⬅ Back

    </button>

    <button id="nextBtn">

        Next Level →

    </button>

</div>

    </div>

</div>

<script src="bottomrow.js"></script>

</body>

</html>
