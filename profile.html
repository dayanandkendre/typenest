<!-- Live Profile Data Handler -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      updateDoc, 
      collection, 
      query, 
      orderBy, 
      limit, 
      getDocs 
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAXzw_g1r7kvYC2d6_d4RqDOoTF_svAphc",
      authDomain: "typenext-5bd90.firebaseapp.com",
      projectId: "typenext-5bd90",
      storageBucket: "typenext-5bd90.firebasestorage.app",
      messagingSenderId: "848488048236",
      appId: "1:848488048236:web:a742a647977a48ca63da49",
      measurementId: "G-B5WGZM350T"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUserId = null;

    // 1. Auth Listener: Check if user is logged in
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUserId = user.uid;
        loadProfileData(user);
      } else {
        // User login nasel tar login modal open kara
        const loginModal = document.getElementById("loginModal");
        if (loginModal) loginModal.classList.remove("hidden");
      }
    });

    // 2. Fetch User Stats & Sessions
    async function loadProfileData(user) {
      const userRef = doc(db, "users", user.uid);
      const snap = await getDoc(userRef);

      const nameDisplay = document.getElementById("profileNameDisplay");
      const usernameInput = document.getElementById("usernameInput");
      const avatarBox = document.getElementById("profileBigAvatar");
      const statWPM = document.getElementById("statTopWPM");
      const statAcc = document.getElementById("statAvgAcc");

      const displayName = (snap.exists() && snap.data().displayName) || user.displayName || "Typist";
      const photoURL = (snap.exists() && snap.data().photoURL) || user.photoURL;

      if (nameDisplay) nameDisplay.innerText = displayName;
      if (usernameInput) usernameInput.value = displayName;

      // Set Avatar Image or Initials
      if (avatarBox) {
        if (photoURL) {
          avatarBox.innerHTML = `<img src="${photoURL}" class="w-full h-full rounded-[14px] object-cover">`;
        } else {
          avatarBox.innerText = displayName.substring(0, 2).toUpperCase();
        }
      }

      if (snap.exists()) {
        const data = snap.data();
        if (statWPM) statWPM.innerText = data.topWpm || 0;
        if (statAcc) statAcc.innerText = `${data.avgAcc || 100}%`;
      }

      // Load Recent Sessions Log
      const sessionList = document.getElementById("sessionList");
      if (sessionList) {
        try {
          const sessionsQuery = query(
            collection(db, "users", user.uid, "sessions"),
            orderBy("createdAt", "desc"),
            limit(5)
          );
          const sessionsSnap = await getDocs(sessionsQuery);

          if (!sessionsSnap.empty) {
            sessionList.innerHTML = "";
            sessionsSnap.forEach((docItem) => {
              const s = docItem.data();
              const div = document.createElement("div");
              div.className = "py-3 flex items-center justify-between";
              div.innerHTML = `
                <span class="text-slate-400"><i class="fa-regular fa-clock mr-2"></i>${s.preset || "Classic Test"}</span>
                <span class="text-indigo-400 font-bold text-sm">${s.wpm} WPM <span class="text-emerald-400 text-xs font-normal">(${s.accuracy}% Acc)</span></span>
              `;
              sessionList.appendChild(div);
            });
          }
        } catch (e) {
          console.warn("Sessions history not found or empty yet.");
        }
      }
    }

    // 3. Save Edited Profile Name to Firestore
    window.saveProfileName = async function () {
      const newName = document.getElementById("usernameInput").value.trim();
      if (!newName || !currentUserId) return;

      try {
        const userRef = doc(db, "users", currentUserId);
        await updateDoc(userRef, { displayName: newName });

        document.getElementById("profileNameDisplay").innerText = newName;
        localStorage.setItem("tn_username", newName);
        alert("Name updated successfully!");
      } catch (err) {
        console.error("Error updating name:", err);
      }
    };
  </script>

  <!-- Reusable Scripts -->
  <script type="module" src="assets/js/layout.js"></script>
