<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeNest Academy | Free Typing Tests, Lessons & Certification</title>
  <meta name="description" content="Master touch typing with TypeNest Academy. Practice live typing speed tests, home row drills, Zen Mode, and earn certified typing credentials.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://typenest.in/index.html">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"Fira Code"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #6366f1; }

    @keyframes blinkCursor {
      0%, 100% { border-color: #6366f1; }
      50% { border-color: transparent; }
    }
    .typing-cursor {
      border-left: 2.5px solid #6366f1;
      animation: blinkCursor 0.9s infinite ease-in-out;
      margin-left: -1px;
    }

    .key-active {
      transform: scale(0.92);
      background-color: #6366f1 !important;
      color: #ffffff !important;
      box-shadow: 0 0 14px rgba(99, 102, 241, 0.7) !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- Header is automatically injected by layout.js -->

  <!-- Main Content Container with Tabs -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- Test Control Bar & Category Selectors -->
    <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-4 shadow-xl backdrop-blur flex flex-wrap items-center justify-between gap-4">
      
      <!-- Category & Skill Mode Picker -->
      <div class="flex items-center flex-wrap gap-2">
        <span class="text-xs uppercase tracking-wider font-semibold text-slate-400 mr-1 flex items-center gap-1.5">
          <i class="fa-solid fa-filter text-indigo-400"></i> Mode:
        </span>
        <button onclick="setTestCategory('beginner', this)" id="cat-beginner" class="cat-pill active px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white shadow-sm transition">
          Beginner Words
        </button>
        <button onclick="setTestCategory('advanced', this)" id="cat-advanced" class="cat-pill px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
          Advanced Prose
        </button>
        <button onclick="setTestCategory('punctuation', this)" id="cat-punctuation" class="cat-pill px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
          Punctuation
        </button>
        <button onclick="setTestCategory('numbers', this)" id="cat-numbers" class="cat-pill px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
          Numbers & Row
        </button>
        <button onclick="setTestCategory('tricky', this)" id="cat-tricky" class="cat-pill px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
          Difficult Words
        </button>
      </div>

      <!-- Duration Controls (1m, 3m, 5m, Zen Mode) -->
      <div class="flex items-center gap-1.5 bg-slate-950/60 p-1 rounded-xl border border-slate-800">
        <span class="text-xs font-semibold text-slate-400 px-2 flex items-center gap-1">
          <i class="fa-regular fa-clock text-indigo-400"></i> Time:
        </span>
        <button onclick="setTimerDuration(60, this)" id="dur-60" class="dur-btn active px-3 py-1 rounded-lg text-xs font-bold bg-indigo-600 text-white transition">1 min</button>
        <button onclick="setTimerDuration(180, this)" id="dur-180" class="dur-btn px-3 py-1 rounded-lg text-xs font-bold bg-transparent text-slate-400 hover:text-white transition">3 min</button>
        <button onclick="setTimerDuration(300, this)" id="dur-300" class="dur-btn px-3 py-1 rounded-lg text-xs font-bold bg-transparent text-slate-400 hover:text-white transition">5 min</button>
        <button onclick="setTimerDuration(0, this)" id="dur-0" class="dur-btn px-3 py-1 rounded-lg text-xs font-bold bg-transparent text-slate-400 hover:text-white transition">Zen Mode</button>
      </div>
    </div>

    <!-- Real-Time Metrics HUD (WPM, Accuracy, Time Left, Errors) -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
      
      <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-xs uppercase font-bold tracking-wider text-slate-400">Speed (WPM)</div>
          <div id="statWPM" class="text-3xl sm:text-4xl font-extrabold text-indigo-400 tracking-tight mt-1 font-mono">0</div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-lg">
          <i class="fa-solid fa-bolt-lightning"></i>
        </div>
      </div>

      <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-xs uppercase font-bold tracking-wider text-slate-400">Accuracy</div>
          <div id="statAccuracy" class="text-3xl sm:text-4xl font-extrabold text-emerald-400 tracking-tight mt-1 font-mono">100<span class="text-lg font-normal">%</span></div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-lg">
          <i class="fa-solid fa-bullseye"></i>
        </div>
      </div>

      <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-xs uppercase font-bold tracking-wider text-slate-400">Time Left</div>
          <div id="statTimer" class="text-3xl sm:text-4xl font-extrabold text-amber-400 tracking-tight mt-1 font-mono">01:00</div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-lg">
          <i class="fa-solid fa-stopwatch"></i>
        </div>
      </div>

      <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-xs uppercase font-bold tracking-wider text-slate-400">Errors / Chars</div>
          <div class="text-2xl sm:text-3xl font-extrabold text-rose-400 tracking-tight mt-1 font-mono">
            <span id="statErrors">0</span> <span class="text-slate-500 text-lg">/</span> <span id="statChars" class="text-slate-300 text-lg">0</span>
          </div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-rose-500/10 text-rose-400 flex items-center justify-center text-lg">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
      </div>
    </div>

    <!-- Typing Arena Box -->
    <div class="relative bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl overflow-hidden focus-within:ring-2 focus-within:ring-indigo-500/50 transition">
      
      <!-- Quick Action Header & Focus hint -->
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800/80 text-xs text-slate-400">
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="testTitleDesc" class="font-medium text-slate-300">1-Minute Speed Challenge: High Frequency Words</span>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="openCustomTextModal(this)" class="hover:text-indigo-400 transition flex items-center gap-1.5">
            <i class="fa-solid fa-pen-nib"></i> Custom Text
          </button>
          <button onclick="resetTypingTest(this)" class="hover:text-indigo-400 transition flex items-center gap-1.5" title="Restart (Esc)">
            <i class="fa-solid fa-rotate-right"></i> Reset Test
          </button>
        </div>
      </div>

      <!-- Hidden input for focus -->
      <input type="text" id="mobileInputSink" class="absolute opacity-0 pointer-events-none -left-full top-0" autocomplete="off" autocapitalize="off" spellcheck="false">

      <!-- Text Container Area -->
      <div id="typingArea" onclick="focusTypingEngine()" class="cursor-text relative min-h-[140px] max-h-[220px] overflow-y-auto font-mono text-xl sm:text-2xl leading-relaxed tracking-wider select-none p-2 rounded-xl bg-slate-950/40 border border-slate-800/60 transition-all focus:outline-none">
        <div id="textDisplay" class="text-slate-500 whitespace-pre-wrap break-words"></div>
      </div>
    </div>

    <!-- Virtual Keyboard is automatically injected here by typing-engine.js -->
    <div id="keyboardWrapper"></div>

  </main>

  <!-- Custom Text Modal -->
  <div id="customTextModal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-6 sm:p-7 shadow-2xl relative">
      <button onclick="closeCustomTextModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      <h3 class="text-lg font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-pen-nib text-indigo-400"></i> Insert Custom Practice Text
      </h3>
      <p class="text-xs text-slate-400 mt-1">Paste your study notes, interview answers, or code excerpts to practice.</p>

      <textarea id="customTextInput" rows="5" class="w-full mt-4 bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 font-mono focus:outline-none focus:border-indigo-500 resize-none" placeholder="Paste custom practice paragraph here..."></textarea>

      <div class="flex justify-end gap-2 mt-4">
        <button onclick="closeCustomTextModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">Cancel</button>
        <button onclick="applyCustomText()" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition">Load & Start</button>
      </div>
    </div>
  </div>

  <!-- Page Logic Controller -->
  <script>
    const TEXT_PRESETS = {
      beginner: [
        "the quick brown fox jumps over the lazy dog and runs through the green forest with high speed and great energy each day",
        "learning to type without looking at the keys builds automatic muscle memory that will last throughout your career and studies",
        "keep your hands relaxed above the desk and let your fingers return naturally to the middle home row keys after every stroke"
      ],
      advanced: [
        "Architectural excellence in software design requires both intuitive understanding of data flow and strict adherence to decoupled abstractions that survive unexpected complexity.",
        "Precision precedes velocity. Those who rush into speed without mastering exact mechanical placement inevitably hit an impassable ceiling of frequent corrections."
      ],
      punctuation: [
        "Can you believe it? She asked: 'Will you finish by 5:00 PM, or should we postpone?' I replied, 'No; everything is ready!'",
        "Wait—did you double-check the server's configuration file? It's under `/var/log/syslog`; please verify its checksum immediately!"
      ],
      numbers: [
        "In 1995, only 16 million people used the internet; by 2026, over 5,400,000,000 citizens interact daily across 195 nations.",
        "Order #84920: Quantity 14 units at $39.99 each equals $559.86 plus 8.25% state tax ($46.19), totaling $606.05 precisely."
      ],
      tricky: [
        "Rhythm rhythmically accommodates bizarre embarrassments through conscientious rendezvous and quintessential idiosyncrasies.",
        "Pneumonia phlegm psychology gnaw knight silhouette mnemonic subtlety subtle camouflage privilege vacuum separate."
      ]
    };

    let currentCategory = 'beginner';
    let durationSeconds = 60;

    function getRandomText(cat) {
      const arr = TEXT_PRESETS[cat] || TEXT_PRESETS.beginner;
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function initPageTest(textOverride = null) {
      const chosenText = textOverride || getRandomText(currentCategory);
      if (window.startTypingSession) {
        window.startTypingSession(chosenText, durationSeconds);
      }
    }

    // Global reset hook for Escape key
    window.resetCurrentTest = function() {
      initPageTest();
    };

    function resetTypingTest(btn) {
      if (btn) btn.blur();
      initPageTest();
    }

    function focusTypingEngine() {
      const sink = document.getElementById('mobileInputSink');
      if (sink) sink.focus();
    }

    function setTestCategory(cat, btn) {
      if (btn) btn.blur(); // Button cha focus kadhun ghetla mhanje space dablyavar restart honar nahi
      currentCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(b => {
        b.classList.remove('bg-indigo-600', 'text-white');
        b.classList.add('bg-slate-800', 'text-slate-300');
      });
      const activeBtn = document.getElementById(`cat-${cat}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-indigo-600', 'text-white');
        activeBtn.classList.remove('bg-slate-800', 'text-slate-300');
      }
      initPageTest();
    }

    function setTimerDuration(seconds, btn) {
      if (btn) btn.blur();
      durationSeconds = seconds;
      document.querySelectorAll('.dur-btn').forEach(b => {
        b.classList.remove('bg-indigo-600', 'text-white');
        b.classList.add('bg-transparent', 'text-slate-400');
      });
      const activeBtn = document.getElementById(`dur-${seconds}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-indigo-600', 'text-white');
        activeBtn.classList.remove('bg-transparent', 'text-slate-400');
      }
      initPageTest();
    }

    function openCustomTextModal(btn) {
      if (btn) btn.blur();
      document.getElementById('customTextModal').classList.remove('hidden');
      document.getElementById('customTextInput').focus();
    }

    function closeCustomTextModal() {
      document.getElementById('customTextModal').classList.add('hidden');
    }

    function applyCustomText() {
      const text = document.getElementById('customTextInput').value.trim();
      if (text.length > 5) {
        closeCustomTextModal();
        initPageTest(text);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initPageTest();
    });
  </script>

  <!-- Reusable Modular Scripts -->
  <script type="module" src="assets/js/layout.js"></script>
  <script src="assets/js/typing-engine.js"></script>
  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/login.js"></script>
</body>
</html>
