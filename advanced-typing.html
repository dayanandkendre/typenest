<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Title, Description & Keywords -->
  <title>Advanced Typing Course & Professional Drills | TypeNest</title>
  <meta name="description" content="Master advanced touch typing with complex prose, code syntax, and long endurance tests. Prepare for government typing exams and competitive typing on TypeNest.">
  <meta name="keywords" content="advanced typing course, professional typing practice, 80 wpm typing, competitive typing test, typenest">
  <meta name="robots" content="index, follow">

  <!-- CRITICAL: Canonical Tag for Google Indexing -->
  <link rel="canonical" href="https://typenest.in/advanced-typing.html">

  <!-- Open Graph / Social Media Preview -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://typenest.in/advanced-typing.html">
  <meta property="og:title" content="Advanced Typing Course & Professional Drills | TypeNest">
  <meta property="og:description" content="Master advanced typing endurance, vocabulary, and reach 80+ WPM with structured professional drills.">
  <meta property="og:image" content="https://typenest.in/images/courses/advanced-course.webp">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://typenest.in/advanced-typing.html">
  <meta name="twitter:title" content="Advanced Typing Course | TypeNest">
  <meta name="twitter:description" content="Master advanced touch typing techniques on TypeNest.">
  <meta name="twitter:image" content="https://typenest.in/images/courses/advanced-course.webp">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #a855f7; }

    @keyframes blinkCursor {
      0%, 100% { border-color: #a855f7; }
      50% { border-color: transparent; }
    }
    .typing-cursor {
      border-left: 2.5px solid #a855f7;
      animation: blinkCursor 0.9s infinite ease-in-out;
      margin-left: -1px;
    }

    .key-active {
      transform: translateY(2px) scale(0.96) !important;
      background: linear-gradient(135deg, #a855f7, #9333ea) !important;
      color: #ffffff !important;
      border-color: #c084fc !important;
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.85) !important;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-purple-500 selection:text-white">

  <!-- Header is automatically injected by assets/js/layout.js -->

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- Top Banner -->
    <div class="border-b border-slate-800 pb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2.5">
          <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase bg-purple-500/10 text-purple-400 border border-purple-500/30">Course 04</span>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-white">Advanced Typing Mastery</h1>
        </div>
        <p class="text-slate-400 text-sm mt-1">Push past 80+ WPM with complex technical prose, vocabulary, and endurance challenges.</p>
      </div>

      <!-- Advanced Step Selector -->
      <div class="flex items-center gap-2 bg-[#111827] p-1.5 rounded-2xl border border-slate-800">
        <button onclick="setAdvDrill(0, this)" id="advbtn-0" class="advbtn px-3 py-1.5 rounded-xl text-xs font-bold bg-purple-600 text-white transition">Drill 1: Complex Prose</button>
        <button onclick="setAdvDrill(1, this)" id="advbtn-1" class="advbtn px-3 py-1.5 rounded-xl text-xs font-bold bg-transparent text-slate-400 hover:text-white transition">Drill 2: Tech & Code</button>
        <button onclick="setAdvDrill(2, this)" id="advbtn-2" class="advbtn px-3 py-1.5 rounded-xl text-xs font-bold bg-transparent text-slate-400 hover:text-white transition">Drill 3: Exam Assessment</button>
      </div>
    </div>

    <!-- Live Performance Stats Bar -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3.5">
      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Speed (WPM)</div>
          <div id="statWPM" class="text-3xl font-extrabold text-purple-400 font-mono mt-0.5">0</div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-purple-500/10 text-purple-400 flex items-center justify-center text-base"><i class="fa-solid fa-bolt"></i></div>
      </div>

      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Accuracy</div>
          <div id="statAccuracy" class="text-3xl font-extrabold text-emerald-400 font-mono mt-0.5">100<span class="text-lg font-normal">%</span></div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-base"><i class="fa-solid fa-bullseye"></i></div>
      </div>

      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Mistakes</div>
          <div id="statErrors" class="text-3xl font-extrabold text-rose-400 font-mono mt-0.5">0</div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-rose-500/10 text-rose-400 flex items-center justify-center text-base"><i class="fa-solid fa-triangle-exclamation"></i></div>
      </div>

      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Target Level</div>
          <div class="text-2xl font-extrabold text-amber-400 font-mono mt-0.5">80+ WPM Pro</div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-base"><i class="fa-solid fa-award"></i></div>
      </div>
    </div>

    <!-- Active Arena Box -->
    <div class="relative bg-[#111827] border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800/90 text-xs text-slate-400">
        <span id="advTitle" class="font-medium text-slate-300 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-purple-400 animate-pulse"></span> Drill 1: Advanced Vocabulary & Complex Prose
        </span>
        <button onclick="resetAdvDrill(this)" class="hover:text-purple-400 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-rotate-right"></i> Reset Drill (Esc)
        </button>
      </div>

      <!-- Hidden input for focus -->
      <input type="text" id="mobileInputSink" class="absolute opacity-0 pointer-events-none -left-full top-0" autocomplete="off" autocapitalize="off" spellcheck="false">

      <div id="typingArea" onclick="focusAdvancedEngine()" class="cursor-text relative min-h-[140px] max-h-[220px] overflow-y-auto font-mono text-xl sm:text-2xl leading-relaxed tracking-wider select-none p-3 rounded-2xl bg-[#0b0f19]/70 border border-slate-800">
        <div id="textDisplay" class="text-slate-500 whitespace-pre-wrap break-words"></div>
      </div>
    </div>

    <!-- Virtual Keyboard is automatically injected here by typing-engine.js -->
    <div id="keyboardWrapper"></div>

  </main>

  <!-- Page Logic Controller -->
  <script>
    const ADV_DRILLS = [
      { title: "Drill 1: Advanced Vocabulary & Complex Prose", text: "Architectural excellence in software design requires both intuitive understanding of data flow and strict adherence to decoupled abstractions that survive unexpected complexity. The fundamental law of human productivity dictates that reducing cognitive friction during expression liberates deep creative thought." },
      { title: "Drill 2: Tech, Code & Syntax Punctuation", text: "const calculateThroughput = (buffer, rate = 1.05) => { if (!buffer || buffer.length === 0) return null; return buffer.map(item => item.val * rate).filter(x => x > 0); };" },
      { title: "Drill 3: Professional Typing Exam Simulation", text: "Government typing examinations and commercial speed benchmarks require uninterrupted concentration under strict time constraints. Cultivate an unwavering cadence, keep your elbows relaxed at right angles, and glide seamlessly through numbers, quotes, and punctuation." }
    ];

    let currentDrillIdx = 0;

    function initAdvSession() {
      const drill = ADV_DRILLS[currentDrillIdx];
      const titleEl = document.getElementById('advTitle');
      if (titleEl) {
        titleEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-purple-400 animate-pulse"></span> ${drill.title}`;
      }

      // Master typing engine call (0 = Zen Mode / untimed accuracy focus)
      if (window.startTypingSession) {
        window.startTypingSession(drill.text, 0);
      }
    }

    // Global reset hook for Escape key
    window.resetCurrentTest = function() {
      initAdvSession();
    };

    function resetAdvDrill(btn) {
      if (btn) btn.blur(); // Blur button so Spacebar never triggers a reset
      initAdvSession();
    }

    function focusAdvancedEngine() {
      const sink = document.getElementById('mobileInputSink');
      if (sink) sink.focus();
    }

    function setAdvDrill(idx, btn) {
      if (btn) btn.blur();
      currentDrillIdx = idx;
      document.querySelectorAll('.advbtn').forEach(b => {
        b.classList.remove('bg-purple-600', 'text-white');
        b.classList.add('bg-transparent', 'text-slate-400');
      });
      const targetBtn = document.getElementById(`advbtn-${idx}`);
      if (targetBtn) {
        targetBtn.classList.add('bg-purple-600', 'text-white');
        targetBtn.classList.remove('text-slate-400');
      }
      initAdvSession();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initAdvSession();
    });
  </script>

  <!-- Reusable Modular Scripts -->
  <script type="module" src="assets/js/layout.js"></script>
  <script src="assets/js/typing-engine.js"></script>
</body>
</html>
