<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Title, Description & Keywords -->
  <title>Speed Building Course & Rhythm Drills | TypeNest</title>
  <meta name="description" content="Boost typing speed from 40 WPM to 80+ WPM with structured rhythm drills, fast bigrams, and high-frequency word bursts on TypeNest.">
  <meta name="keywords" content="speed building typing, typing speed drills, fast bigrams, typing cadence, high frequency words typing, typenest">
  <meta name="robots" content="index, follow">

  <!-- CRITICAL: Canonical Tag for Google Indexing -->
  <link rel="canonical" href="https://typenest.in/speed-building.html">

  <!-- Open Graph / Social Media Preview -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://typenest.in/speed-building.html">
  <meta property="og:title" content="Speed Building Course & Rhythm Drills | TypeNest">
  <meta property="og:description" content="Train typing cadence, eliminate hesitations, and build high-speed muscle bursts.">
  <meta property="og:image" content="https://typenest.in/images/courses/intermediate-course.webp">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://typenest.in/speed-building.html">
  <meta name="twitter:title" content="Speed Building Course | TypeNest">
  <meta name="twitter:description" content="Master typing speed bursts and continuous flow on TypeNest.">
  <meta name="twitter:image" content="https://typenest.in/images/courses/intermediate-course.webp">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #6366f1; }

    @keyframes blinkCursor {
      0%, 100% { border-color: #6366f1; }
      50% { border-color: transparent; }
    }
    .typing-cursor {
      border-left: 2.5px solid #6366f1;
      animation: blinkCursor 0.9s infinite ease-in-out;
      margin-left: -1px;
    }

    .key-cap {
      transition: all 0.08s ease;
      user-select: none;
      box-shadow: 0 3px 0 0 #0f172a, 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }
    .key-active {
      transform: translateY(2px) scale(0.96) !important;
      background: linear-gradient(135deg, #6366f1, #4f46e5) !important;
      color: #ffffff !important;
      border-color: #818cf8 !important;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.85) !important;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- Header is automatically injected by assets/js/layout.js -->

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- Top Banner -->
    <div class="border-b border-slate-800 pb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2.5">
          <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase bg-amber-500/10 text-amber-400 border border-amber-500/30">Course 02</span>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-white">Speed Building Drills</h1>
        </div>
        <p class="text-slate-400 text-sm mt-1">Train finger cadence and eliminate hesitation between high-frequency n-grams.</p>
      </div>

      <!-- Drill Steps Selector -->
      <div class="flex items-center gap-2 bg-[#111827] p-1.5 rounded-2xl border border-slate-800">
        <button onclick="setDrill(0, this)" id="dbtn-0" class="dbtn px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white transition">Drill 1: Frequent Words</button>
        <button onclick="setDrill(1, this)" id="dbtn-1" class="dbtn px-3 py-1.5 rounded-xl text-xs font-bold bg-transparent text-slate-400 hover:text-white transition">Drill 2: Fast Bigrams</button>
        <button onclick="setDrill(2, this)" id="dbtn-2" class="dbtn px-3 py-1.5 rounded-xl text-xs font-bold bg-transparent text-slate-400 hover:text-white transition">Drill 3: Flow Cadence</button>
      </div>
    </div>

    <!-- Live Performance Stats Bar -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3.5">
      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Speed (WPM)</div>
          <div id="statWPM" class="text-3xl font-extrabold text-indigo-400 font-mono mt-0.5">0</div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-base"><i class="fa-solid fa-bolt"></i></div>
      </div>

      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Accuracy</div>
          <div id="statAccuracy" class="text-3xl font-extrabold text-emerald-400 font-mono mt-0.5">100<span class="text-lg font-normal">%</span></div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-base"><i class="fa-solid fa-bullseye"></i></div>
      </div>

      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Mistakes</div>
          <div id="statErrors" class="text-3xl font-extrabold text-rose-400 font-mono mt-0.5">0</div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-rose-500/10 text-rose-400 flex items-center justify-center text-base"><i class="fa-solid fa-triangle-exclamation"></i></div>
      </div>

      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Cadence Target</div>
          <div class="text-2xl font-extrabold text-amber-400 font-mono mt-0.5">Fluid Rhythm</div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-base"><i class="fa-solid fa-gauge-simple-high"></i></div>
      </div>
    </div>

    <!-- Active Drill Arena -->
    <div class="relative bg-[#111827] border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800/90 text-xs text-slate-400">
        <span id="drillTitle" class="font-medium text-slate-300 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Drill 1: High Frequency Word Bursts
        </span>
        <button onclick="resetDrill(this)" class="hover:text-indigo-400 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-rotate-right"></i> Reset Drill (Esc)
        </button>
      </div>

      <!-- Hidden input for mobile keyboard touch focus -->
      <input type="text" id="mobileInputSink" class="absolute opacity-0 pointer-events-none -left-full top-0" autocomplete="off" autocapitalize="off" spellcheck="false">

      <div id="typingArea" onclick="focusSpeedEngine()" class="cursor-text relative min-h-[140px] max-h-[220px] overflow-y-auto font-mono text-xl sm:text-2xl leading-relaxed tracking-wider select-none p-3 rounded-2xl bg-[#0b0f19]/70 border border-slate-800">
        <div id="textDisplay" class="text-slate-500 whitespace-pre-wrap break-words"></div>
      </div>
    </div>

    <!-- Virtual Keyboard is automatically injected here by typing-engine.js -->
    <div id="keyboardWrapper"></div>

  </main>

  <!-- Page Logic Controller -->
  <script>
    const DRILLS = [
      { title: "Drill 1: High Frequency Word Bursts", text: "the and that have with this will your from they know want good some time could them other than then now look only come its over think also back after use two how our work first well way even new want because any these give day most us" },
      { title: "Drill 2: Fast Bigram Muscle Memory", text: "th he in er an re nd at on nt ha es st en ed to it ou ea hi is or ti as te et ng of al de se le sa si ar me ra ma li ch no" },
      { title: "Drill 3: Flow Cadence & Rhythm", text: "speed comes naturally when you focus on smooth continuous keystrokes rather than rushed bursts. keep your breathing relaxed and let words form fluid chords." }
    ];

    let currentDrillIdx = 0;

    function initSpeedSession() {
      const drill = DRILLS[currentDrillIdx];
      const titleEl = document.getElementById('drillTitle');
      if (titleEl) {
        titleEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> ${drill.title}`;
      }

      // Master typing engine call (0 = Zen Mode / untimed cadence flow)
      if (window.startTypingSession) {
        window.startTypingSession(drill.text, 0);
      }
    }

    // Global reset hook for Escape key
    window.resetCurrentTest = function() {
      initSpeedSession();
    };

    function resetDrill(btn) {
      if (btn) btn.blur(); // Blur button so Spacebar never triggers button reset
      initSpeedSession();
    }

    function focusSpeedEngine() {
      const sink = document.getElementById('mobileInputSink');
      if (sink) sink.focus();
    }

    function setDrill(idx, btn) {
      if (btn) btn.blur();
      currentDrillIdx = idx;
      document.querySelectorAll('.dbtn').forEach(b => {
        b.classList.remove('bg-indigo-600', 'text-white');
        b.classList.add('bg-transparent', 'text-slate-400');
      });
      const targetBtn = document.getElementById(`dbtn-${idx}`);
      if (targetBtn) {
        targetBtn.classList.add('bg-indigo-600', 'text-white');
        targetBtn.classList.remove('text-slate-400');
      }
      initSpeedSession();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initSpeedSession();
    });
  </script>

  <!-- Reusable Modular Scripts -->
  <script type="module" src="assets/js/layout.js"></script>
  <script src="assets/js/typing-engine.js"></script>
</body>
</html>
