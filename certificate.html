<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Typing Certificate - TypeNest</title>

<meta name="description"
content="Earn and download your TypeNest Typing Certificate after successfully completing your typing journey and achieving 100% course progress.">

<meta name="keywords"
content="typing certificate, typing completion certificate, TypeNest certificate, typing achievement, typing course certificate">

<link rel="canonical"
href="https://typenest.in/certificate.html">

<link rel="stylesheet"
href="certificate.css">

</head>

<body>

<div class="certificate-container">

<div class="certificate">

<h1>
🏆 TypeNest
</h1>

<h2>
CERTIFICATE OF ACHIEVEMENT
</h2>

<p>
This certifies that
</p>

<h3 id="certificateName">

Loading...

</h3>

<p>
has successfully completed
all TypeNest typing levels.
</p>

<p>
Completion Date:
<span id="completionDate"></span>
</p>

<div class="stars">

⭐⭐⭐⭐⭐

</div>

<h4>

TypeNest Team

</h4>

<button
id="printBtn">

🖨️ Print Certificate

</button>
  
</div>

</div>

<script type="module"
src="certificate.js">
</script>

</body>

</html>
