<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Accuracy Mastery Course | TypeNest</title>
  <meta name="description" content="Improve typing precision, eliminate mistakes, and master steady keyboard rhythm with TypeNest Accuracy Mastery drills.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://typenest.in/accuracy-mastery.html">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }

    @keyframes blinkCursor {
      0%, 100% { border-color: #06b6d4; }
      50% { border-color: transparent; }
    }
    .typing-cursor {
      border-left: 2.5px solid #06b6d4;
      animation: blinkCursor 0.9s infinite ease-in-out;
      margin-left: -1px;
    }

    .key-active {
      transform: translateY(2px) scale(0.96) !important;
      background: linear-gradient(135deg, #06b6d4, #0891b2) !important;
      color: #ffffff !important;
      border-color: #38bdf8 !important;
      box-shadow: 0 0 16px rgba(6, 182, 212, 0.85) !important;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-cyan-500 selection:text-white">

  <!-- Header is automatically injected by assets/js/layout.js -->

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- Top Banner -->
    <div class="border-b border-slate-800 pb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2.5">
          <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">Course 03</span>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-white">Accuracy Mastery Drills</h1>
        </div>
        <p class="text-slate-400 text-sm mt-1">Speed is a byproduct of precision. Focus on 100% correct keystrokes without rushing.</p>
      </div>

      <!-- Precision Drill Selector -->
      <div class="flex items-center gap-2 bg-[#111827] p-1.5 rounded-2xl border border-slate-800">
        <button onclick="setAccDrill(0, this)" id="abtn-0" class="abtn px-3 py-1.5 rounded-xl text-xs font-bold bg-cyan-600 text-white transition">Drill 1: Calm Rhythm</button>
        <button onclick="setAccDrill(1, this)" id="abtn-1" class="abtn px-3 py-1.5 rounded-xl text-xs font-bold bg-transparent text-slate-400 hover:text-white transition">Drill 2: Tricky Spellings</button>
        <button onclick="setAccDrill(2, this)" id="abtn-2" class="abtn px-3 py-1.5 rounded-xl text-xs font-bold bg-transparent text-slate-400 hover:text-white transition">Drill 3: Punctuation Rules</button>
      </div>
    </div>

    <!-- Live Performance Stats Bar -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3.5">
      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Speed (WPM)</div>
          <div id="statWPM" class="text-3xl font-extrabold text-cyan-400 font-mono mt-0.5">0</div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-cyan-500/10 text-cyan-400 flex items-center justify-center text-base"><i class="fa-solid fa-bolt"></i></div>
      </div>

      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Accuracy</div>
          <div id="statAccuracy" class="text-3xl font-extrabold text-emerald-400 font-mono mt-0.5">100<span class="text-lg font-normal">%</span></div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-base"><i class="fa-solid fa-bullseye"></i></div>
      </div>

      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Mistakes</div>
          <div id="statErrors" class="text-3xl font-extrabold text-rose-400 font-mono mt-0.5">0</div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-rose-500/10 text-rose-400 flex items-center justify-center text-base"><i class="fa-solid fa-circle-exclamation"></i></div>
      </div>

      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Precision Goal</div>
          <div class="text-2xl font-extrabold text-amber-400 font-mono mt-0.5">99%+ Target</div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-base"><i class="fa-solid fa-medal"></i></div>
      </div>
    </div>

    <!-- Active Accuracy Arena -->
    <div class="relative bg-[#111827] border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800/90 text-xs text-slate-400">
        <span id="accTitle" class="font-medium text-slate-300 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Drill 1: Calm Rhythm & Zero Hesitation
        </span>
        <button onclick="resetAccDrill(this)" class="hover:text-cyan-400 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-rotate-right"></i> Reset Drill (Esc)
        </button>
      </div>

      <!-- Hidden input for focus -->
      <input type="text" id="mobileInputSink" class="absolute opacity-0 pointer-events-none -left-full top-0" autocomplete="off" autocapitalize="off" spellcheck="false">

      <div id="typingArea" onclick="focusAccuracyEngine()" class="cursor-text relative min-h-[140px] max-h-[220px] overflow-y-auto font-mono text-xl sm:text-2xl leading-relaxed tracking-wider select-none p-3 rounded-2xl bg-[#0b0f19]/70 border border-slate-800">
        <div id="textDisplay" class="text-slate-500 whitespace-pre-wrap break-words"></div>
      </div>
    </div>

    <!-- Virtual Keyboard is automatically injected here by typing-engine.js -->
    <div id="keyboardWrapper"></div>

  </main>

  <!-- Page Logic Controller -->
  <script>
    const ACC_DRILLS = [
      { title: "Drill 1: Calm Rhythm & Zero Hesitation", text: "Precision precedes velocity. Do not rush any stroke until you are certain of finger reach. A steady, calm typing tempo eliminates backspacing and produces genuine velocity over extended periods." },
      { title: "Drill 2: Tricky Double Letters & Awkward Reaches", text: "Accommodate embarrassingly bizarre bureaucracy with conscientious precision. Millennium questionnaires supersede quintessential idiosyncrasies without unnecessary rhythm hesitations." },
      { title: "Drill 3: Punctuation Rules & Controlled Pacing", text: "Can you maintain 100% precision? Always pause briefly after periods, commas, and semicolons: 'Practice makes permanent; only accurate practice makes perfect!'" }
    ];

    let currentDrillIdx = 0;

    function initAccSession() {
      const drill = ACC_DRILLS[currentDrillIdx];
      const titleEl = document.getElementById('accTitle');
      if (titleEl) {
        titleEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> ${drill.title}`;
      }

      // Master typing engine call (Zen Mode - unlimited time for accuracy practice)
      if (window.startTypingSession) {
        window.startTypingSession(drill.text, 0);
      }
    }

    // Global reset hook for Escape key
    window.resetCurrentTest = function() {
      initAccSession();
    };

    function resetAccDrill(btn) {
      if (btn) btn.blur(); // Blur button so Spacebar never triggers button reset
      initAccSession();
    }

    function focusAccuracyEngine() {
      const sink = document.getElementById('mobileInputSink');
      if (sink) sink.focus();
    }

    function setAccDrill(idx, btn) {
      if (btn) btn.blur();
      currentDrillIdx = idx;
      document.querySelectorAll('.abtn').forEach(b => {
        b.classList.remove('bg-cyan-600', 'text-white');
        b.classList.add('bg-transparent', 'text-slate-400');
      });
      const targetBtn = document.getElementById(`abtn-${idx}`);
      if (targetBtn) {
        targetBtn.classList.add('bg-cyan-600', 'text-white');
        targetBtn.classList.remove('text-slate-400');
      }
      initAccSession();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initAccSession();
    });
  </script>

  <!-- Reusable Modular Scripts -->
  <script type="module" src="assets/js/layout.js"></script>
  <script src="assets/js/typing-engine.js"></script>
</body>
</html>
