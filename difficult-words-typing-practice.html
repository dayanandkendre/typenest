<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Title, Description & Keywords -->
  <title>Difficult Words Typing Practice & Tricky Spellings | TypeNest</title>
  <meta name="description" content="Master awkward finger reaches and tricky English spellings with difficult words typing practice on TypeNest. Build muscle memory for complex vocabulary.">
  <meta name="keywords" content="difficult words typing practice, tricky typing words, hard typing practice, awkward finger reaches, typenest">
  <meta name="robots" content="index, follow">

  <!-- CRITICAL: Canonical Tag for Google Indexing -->
  <link rel="canonical" href="https://typenest.in/difficult-words-typing-practice.html">

  <!-- Open Graph / Social Media Preview -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://typenest.in/difficult-words-typing-practice.html">
  <meta property="og:title" content="Difficult Words Typing Practice & Tricky Spellings | TypeNest">
  <meta property="og:description" content="Improve precision and speed on complex vocabulary, double letters, and awkward keyboard movements.">
  <meta property="og:image" content="https://typenest.in/images/courses/accuracy-course.webp">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://typenest.in/difficult-words-typing-practice.html">
  <meta name="twitter:title" content="Difficult Words Typing Practice | TypeNest">
  <meta name="twitter:description" content="Build finger dexterity on tricky English vocabulary.">
  <meta name="twitter:image" content="https://typenest.in/images/courses/accuracy-course.webp">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #f43f5e; }

    @keyframes blinkCursor {
      0%, 100% { border-color: #f43f5e; }
      50% { border-color: transparent; }
    }
    .typing-cursor {
      border-left: 2.5px solid #f43f5e;
      animation: blinkCursor 0.9s infinite ease-in-out;
      margin-left: -1px;
    }

    .key-active {
      transform: translateY(2px) scale(0.96) !important;
      background: linear-gradient(135deg, #f43f5e, #e11d48) !important;
      color: #ffffff !important;
      border-color: #fb7185 !important;
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.85) !important;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-rose-500 selection:text-white">

  <!-- Header is automatically injected by assets/js/layout.js -->

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- Top Banner -->
    <div class="border-b border-slate-800 pb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2.5">
          <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase bg-rose-500/10 text-rose-400 border border-rose-500/30">Target Drill</span>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-white">Difficult Words Typing Practice</h1>
        </div>
        <p class="text-slate-400 text-sm mt-1">Conquer complex spellings, awkward key reaches, and silent letters with targeted muscle memory drills[cite: 2, 4].</p>
      </div>

      <!-- Difficult Categories Selector -->
      <div class="flex items-center gap-2 bg-[#111827] p-1.5 rounded-2xl border border-slate-800">
        <button onclick="setDiffDrill(0, this)" id="diffbtn-0" class="diffbtn px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-600 text-white transition">Set 1: Common Traps</button>
        <button onclick="setDiffDrill(1, this)" id="diffbtn-1" class="diffbtn px-3 py-1.5 rounded-xl text-xs font-bold bg-transparent text-slate-400 hover:text-white transition">Set 2: Awkward Reaches</button>
        <button onclick="setDiffDrill(2, this)" id="diffbtn-2" class="diffbtn px-3 py-1.5 rounded-xl text-xs font-bold bg-transparent text-slate-400 hover:text-white transition">Set 3: Silent Letters</button>
      </div>
    </div>

    <!-- Live Performance Stats Bar -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3.5">
      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Speed (WPM)</div>
          <div id="statWPM" class="text-3xl font-extrabold text-rose-400 font-mono mt-0.5">0</div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-rose-500/10 text-rose-400 flex items-center justify-center text-base"><i class="fa-solid fa-bolt"></i></div>
      </div>

      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Accuracy</div>
          <div id="statAccuracy" class="text-3xl font-extrabold text-emerald-400 font-mono mt-0.5">100<span class="text-lg font-normal">%</span></div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-base"><i class="fa-solid fa-bullseye"></i></div>
      </div>

      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Mistakes</div>
          <div id="statErrors" class="text-3xl font-extrabold text-rose-400 font-mono mt-0.5">0</div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-rose-500/10 text-rose-400 flex items-center justify-center text-base"><i class="fa-solid fa-triangle-exclamation"></i></div>
      </div>

      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Focus Metric</div>
          <div class="text-2xl font-extrabold text-amber-400 font-mono mt-0.5">Dexterity</div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-base"><i class="fa-solid fa-hand"></i></div>
      </div>
    </div>

    <!-- Active Arena Box -->
    <div class="relative bg-[#111827] border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800/90 text-xs text-slate-400">
        <span id="diffTitle" class="font-medium text-slate-300 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-rose-400 animate-pulse"></span> Set 1: Commonly Misspelled & Tricky Words
        </span>
        <button onclick="resetDiffDrill(this)" class="hover:text-rose-400 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-rotate-right"></i> Reset Drill (Esc)
        </button>
      </div>

      <!-- Hidden input for mobile keyboard touch focus -->
      <input type="text" id="mobileInputSink" class="absolute opacity-0 pointer-events-none -left-full top-0" autocomplete="off" autocapitalize="off" spellcheck="false">

      <div id="typingArea" onclick="focusDifficultEngine()" class="cursor-text relative min-h-[140px] max-h-[220px] overflow-y-auto font-mono text-xl sm:text-2xl leading-relaxed tracking-wider select-none p-3 rounded-2xl bg-[#0b0f19]/70 border border-slate-800">
        <div id="textDisplay" class="text-slate-500 whitespace-pre-wrap break-words"></div>
      </div>
    </div>

    <!-- Virtual Keyboard is automatically injected here by typing-engine.js -->
    <div id="keyboardWrapper"></div>

  </main>

  <!-- Page Logic Controller -->
  <script>
    const DIFFICULT_SETS = [
      { title: "Set 1: Commonly Misspelled & Tricky Words", text: "accommodate rhythm silhouette bureaucracy vacuum privilege embarrass maneuver guarantee questionnaire necessary parallel separate maintenance conscientious liaison hierarchy miscellaneous" },
      { title: "Set 2: Awkward Key Reaches & Alternations", text: "quintessential idiosyncrasy rendezvous exaggeration phenomenon rendezvous asynchronous juxtaposition polypropylene chrysanthemum schizophrenia synchronization perpendicular" },
      { title: "Set 3: Silent Letters & Phonetic Deceptions", text: "pneumonia rendezvous subtle receipt psychology mnemonic knight dumbfound sovereign champagne phlegm silhouette diaphragm mortgage poignant solemn foreign gnaw subtle" }
    ];

    let currentDrillIdx = 0;

    function initDiffSession() {
      const drill = DIFFICULT_SETS[currentDrillIdx];
      const titleEl = document.getElementById('diffTitle');
      if (titleEl) {
        titleEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-400 animate-pulse"></span> ${drill.title}`;
      }

      // Master typing engine call (0 = Zen Mode / untimed dexterity focus)
      if (window.startTypingSession) {
        window.startTypingSession(drill.text, 0);
      }
    }

    // Global reset hook for Escape key
    window.resetCurrentTest = function() {
      initDiffSession();
    };

    function resetDiffDrill(btn) {
      if (btn) btn.blur(); // Blur button so Spacebar never triggers reset
      initDiffSession();
    }

    function focusDifficultEngine() {
      const sink = document.getElementById('mobileInputSink');
      if (sink) sink.focus();
    }

    function setDiffDrill(idx, btn) {
      if (btn) btn.blur();
      currentDrillIdx = idx;
      document.querySelectorAll('.diffbtn').forEach(b => {
        b.classList.remove('bg-rose-600', 'text-white');
        b.classList.add('bg-transparent', 'text-slate-400');
      });
      const targetBtn = document.getElementById(`diffbtn-${idx}`);
      if (targetBtn) {
        targetBtn.classList.add('bg-rose-600', 'text-white');
        targetBtn.classList.remove('text-slate-400');
      }
      initDiffSession();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initDiffSession();
    });
  </script>

  <!-- Reusable Modular Scripts -->
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/typing-engine.js"></script>
</body>
</html>
