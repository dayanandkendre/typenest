<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Title, Description & Keywords -->
  <title>Number Row Typing Practice & Numerical Drills | TypeNest</title>
  <meta name="description" content="Master the top number row without looking down. Practice numerical typing drills, dates, codes, and figures on TypeNest.">
  <meta name="keywords" content="number typing practice, number row typing, numeric keyboard drills, 10 key practice, typenest">
  <meta name="robots" content="index, follow">

  <!-- CRITICAL: Canonical Tag for Google Indexing -->
  <link rel="canonical" href="https://typenest.in/number-typing-practice.html">

  <!-- Open Graph / Social Media Preview -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://typenest.in/number-typing-practice.html">
  <meta property="og:title" content="Number Row Typing Practice & Numerical Drills | TypeNest">
  <meta property="og:description" content="Build tactile muscle memory for top-row numbers, phone figures, and accounting data on TypeNest.">
  <meta property="og:image" content="https://typenest.in/images/courses/intermediate-course.webp">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://typenest.in/number-typing-practice.html">
  <meta name="twitter:title" content="Number Row Typing Practice | TypeNest">
  <meta name="twitter:description" content="Master top row numeric keys with interactive drills.">
  <meta name="twitter:image" content="https://typenest.in/images/courses/intermediate-course.webp">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #f59e0b; }

    @keyframes blinkCursor {
      0%, 100% { border-color: #f59e0b; }
      50% { border-color: transparent; }
    }
    .typing-cursor {
      border-left: 2.5px solid #f59e0b;
      animation: blinkCursor 0.9s infinite ease-in-out;
      margin-left: -1px;
    }

    .key-cap {
      transition: all 0.08s ease;
      user-select: none;
      box-shadow: 0 3px 0 0 #0f172a, 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }
    .key-active {
      transform: translateY(2px) scale(0.96) !important;
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      color: #ffffff !important;
      border-color: #fbbf24 !important;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.85) !important;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-amber-500 selection:text-white">

  <!-- Header is automatically injected by assets/js/layout.js -->

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- Top Banner -->
    <div class="border-b border-slate-800 pb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2.5">
          <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase bg-amber-500/10 text-amber-400 border border-amber-500/30">Target Drill</span>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-white">Number Row Typing Practice</h1>
        </div>
        <p class="text-slate-400 text-sm mt-1">Overcome the habit of glancing down for top-row numbers, phone formats, and dates.</p>
      </div>

      <!-- Number Drills Selector -->
      <div class="flex items-center gap-2 bg-[#111827] p-1.5 rounded-2xl border border-slate-800">
        <button onclick="setNumDrill(0, this)" id="numbtn-0" class="numbtn px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-600 text-white transition">Drill 1: 1 to 0 Basics</button>
        <button onclick="setNumDrill(1, this)" id="numbtn-1" class="numbtn px-3 py-1.5 rounded-xl text-xs font-bold bg-transparent text-slate-400 hover:text-white transition">Drill 2: Phone & Dates</button>
        <button onclick="setNumDrill(2, this)" id="numbtn-2" class="numbtn px-3 py-1.5 rounded-xl text-xs font-bold bg-transparent text-slate-400 hover:text-white transition">Drill 3: Mixed Stats</button>
      </div>
    </div>

    <!-- Live Performance Stats Bar -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3.5">
      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Speed (WPM)</div>
          <div id="statWPM" class="text-3xl font-extrabold text-amber-400 font-mono mt-0.5">0</div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-base"><i class="fa-solid fa-bolt"></i></div>
      </div>

      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Accuracy</div>
          <div id="statAccuracy" class="text-3xl font-extrabold text-emerald-400 font-mono mt-0.5">100<span class="text-lg font-normal">%</span></div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-base"><i class="fa-solid fa-bullseye"></i></div>
      </div>

      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Mistakes</div>
          <div id="statErrors" class="text-3xl font-extrabold text-rose-400 font-mono mt-0.5">0</div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-rose-500/10 text-rose-400 flex items-center justify-center text-base"><i class="fa-solid fa-triangle-exclamation"></i></div>
      </div>

      <div class="bg-[#111827]/60 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Finger Reach</div>
          <div class="text-2xl font-extrabold text-indigo-400 font-mono mt-0.5">Top Row</div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-base"><i class="fa-solid fa-arrow-up"></i></div>
      </div>
    </div>

    <!-- Active Arena Box -->
    <div class="relative bg-[#111827] border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800/90 text-xs text-slate-400">
        <span id="numTitle" class="font-medium text-slate-300 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Drill 1: Sequential Numbers & Finger Reach
        </span>
        <button onclick="resetNumDrill(this)" class="hover:text-amber-400 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-rotate-right"></i> Reset Drill (Esc)
        </button>
      </div>

      <!-- Hidden input for mobile keyboard touch focus -->
      <input type="text" id="mobileInputSink" class="absolute opacity-0 pointer-events-none -left-full top-0" autocomplete="off" autocapitalize="off" spellcheck="false">

      <div id="typingArea" onclick="focusNumberEngine()" class="cursor-text relative min-h-[140px] max-h-[220px] overflow-y-auto font-mono text-xl sm:text-2xl leading-relaxed tracking-wider select-none p-3 rounded-2xl bg-[#0b0f19]/70 border border-slate-800">
        <div id="textDisplay" class="text-slate-500 whitespace-pre-wrap break-words"></div>
      </div>
    </div>

    <!-- Virtual Keyboard is automatically injected here by typing-engine.js -->
    <div id="keyboardWrapper"></div>

  </main>

  <!-- Page Logic Controller -->
  <script>
    const NUMBER_SETS = [
      { title: "Drill 1: Sequential Numbers & Finger Reach", text: "1234 5678 9012 3456 7890 1029 3847 5612 9083 7465 1928 3746 5019 2837 4650 9182 7364 5019" },
      { title: "Drill 2: Phone Numbers, Dates & Codes", text: "Dial 1-800-555-0199 on 12/04/2026. Account number 98402-1823 confirmed on 24-10-1995. Flight 492 departs at 14:35 gate B18." },
      { title: "Drill 3: Financial & Mixed Data Statistics", text: "Order #84920: 14 units at 39 dollars totaling 546 dollars with 18% tax. Year 1995 had 16 million users, but 2026 reached 5400 million citizens." }
    ];

    let currentDrillIdx = 0;

    function initNumSession() {
      const drill = NUMBER_SETS[currentDrillIdx];
      const titleEl = document.getElementById('numTitle');
      if (titleEl) {
        titleEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> ${drill.title}`;
      }

      // Master typing engine call (0 = Zen Mode / untimed number reach practice)
      if (window.startTypingSession) {
        window.startTypingSession(drill.text, 0);
      }
    }

    // Global reset hook for Escape key
    window.resetCurrentTest = function() {
      initNumSession();
    };

    function resetNumDrill(btn) {
      if (btn) btn.blur(); // Blur button so Spacebar never triggers reset
      initNumSession();
    }

    function focusNumberEngine() {
      const sink = document.getElementById('mobileInputSink');
      if (sink) sink.focus();
    }

    function setNumDrill(idx, btn) {
      if (btn) btn.blur();
      currentDrillIdx = idx;
      document.querySelectorAll('.numbtn').forEach(b => {
        b.classList.remove('bg-amber-600', 'text-white');
        b.classList.add('bg-transparent', 'text-slate-400');
      });
      const targetBtn = document.getElementById(`numbtn-${idx}`);
      if (targetBtn) {
        targetBtn.classList.add('bg-amber-600', 'text-white');
        targetBtn.classList.remove('text-slate-400');
      }
      initNumSession();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initNumSession();
    });
  </script>

  <!-- Reusable Modular Scripts -->
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/typing-engine.js"></script>
</body>
</html>
